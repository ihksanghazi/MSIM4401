<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengakses DOM</title>
</head>
<body>
    <div id="app">
        <input v-model="isianTeks" placeholder="ketikan sesuatu">
        <button @click="cekIsianTeks($event)">Kirim</button> 
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const {createApp} = Vue;

        const App = {
            data() {
                return {
                    isianTeks:""
                }
            },
            methods:{
                cekIsianTeks(event){
                    if (this.isianTeks === ""){
                        event.preventDefault()
                        alert('isikan teks telebih dahulu' + event)
                    }else{
                        alert('Terima Kasih sudah mengisi teks' + event)
                    }
                }
            }
        }

        createApp(App).mount('#app')
    </script>
</body>
</html>
