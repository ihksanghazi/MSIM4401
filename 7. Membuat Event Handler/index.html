<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Event Handler</title>
</head>
<body>

    <div id="app">
        <p>Jumlah Klik : {{klik}}</p>
        <button @click="klik += 1">Klik untuk tambah 1</button>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const {createApp} = Vue;

        const App = {
            data() {
                return {
                    klik: 0
                }
            }
        }

        createApp(App).mount('#app')
    </script>
</body>
</html>
