<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier dalam event Handler</title>
</head>
<body>
    <div id="app">
        <button @click.once="tampilPesan">Klik Sekali saja</button>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        const {createApp} = Vue;

        const App = {
            data () {
                return {
                    klik:0
                }
            },
            methods: {
                tampilPesan() {
                    alert("Hanya Boleh sekali klik, setelah itu tidak bisa")
                }
            }
        }

        createApp(App).mount("#app")
    </script>
</body>
</html>
